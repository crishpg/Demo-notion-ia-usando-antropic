version: '3.8'

services:
  # ==================================
  # PostgreSQL Database
  # ==================================
  postgres:
    image: postgres:14-alpine
    container_name: freelancers-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freelancer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freelancer123}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_freelancers}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sistema_freelancers_ddl.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - freelancers-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freelancer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================
  # Next.js Application
  # ==================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freelancers-app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-freelancer}:${POSTGRES_PASSWORD:-freelancer123}@postgres:5432/${POSTGRES_DB:-sistema_freelancers}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - freelancers-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================================
  # PgAdmin (Opcional - apenas para desenvolvimento)
  # ==================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: freelancers-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - freelancers-network
    depends_on:
      - postgres
    profiles:
      - dev

# ==================================
# Volumes
# ==================================
volumes:
  postgres_data:
    driver: local
    name: freelancers_postgres_data
  pgadmin_data:
    driver: local
    name: freelancers_pgadmin_data

# ==================================
# Networks
# ==================================
networks:
  freelancers-network:
    driver: bridge
    name: freelancers_network
